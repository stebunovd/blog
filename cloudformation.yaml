AWSTemplateFormatVersion: '2010-09-09'
Description: S3 website hosting and CloudFront for stebunov.com

Parameters:
  BucketName:
    Type: String
    Default: stebunov.com
  WebsiteDomainName:
    Type: String
    Default: stebunov.com
  WebsiteCertificateARN:
    Type: String
    Description: ARN of an existing ACM certificate in us-east-1 covering WebsiteDomainName
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+'

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      # Preserve the existing settings. The website endpoint needs public reads.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'

  WebsiteRedirectFunction:
    Type: AWS::CloudFront::Function
    # The retained distribution still references this function if the stack is deleted.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}-redirects'
      AutoPublish: true
      FunctionConfig:
        Comment: Exact-path redirects for the website
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            // Ignore trailing slashes in both request paths and redirect keys.
            // Destinations may be local paths or full HTTPS URLs.
            // Original query parameters are intentionally not forwarded.
            var redirects = {
                '/three-steps/': { location: 'https://ivelum.com/blog/three-steps/', statusCode: 301 },
            };

            var request = event.request;
            var path = request.uri.replace(/\/+$/, '') || '/';
            var paths = Object.keys(redirects);
            var redirect;
            for (var i = 0; i < paths.length; i++) {
                if ((paths[i].replace(/\/+$/, '') || '/') === path) {
                    redirect = redirects[paths[i]];
                    break;
                }
            }
            if (!redirect) {
                return request;
            }

            return {
                statusCode: redirect.statusCode,
                statusDescription: redirect.statusCode === 302 ? 'Found' : 'Moved Permanently',
                headers: {
                    location: { value: redirect.location }
                }
            };
        }

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref WebsiteDomainName
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          # Use the website endpoint so Hugo's /path/ URLs resolve to index.html.
          - DomainName: !Select [2, !Split ['/', !GetAtt WebsiteBucket.WebsiteURL]]
            Id: !Ref WebsiteBucket
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: !Ref WebsiteBucket
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebsiteRedirectFunction.FunctionMetadata.FunctionARN
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # AWS managed CachingOptimized policy, matching the live distribution.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
        ViewerCertificate:
          AcmCertificateArn: !Ref WebsiteCertificateARN
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
